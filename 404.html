<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost at sea &middot; Hawaiian Shirt Studios</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <style>
    html,body{height:100%;margin:0}
    body{
      display:flex;align-items:center;justify-content:center;text-align:center;
      font-family:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:#fff;padding:1.5rem;
      background:linear-gradient(180deg,#FFEFD6 0%,#FFC79B 24%,#FF7A5C 46%,#F4593B 58%,#1B7A99 82%,#0E4C66 100%);
    }
    .card{max-width:460px}
    img{width:96px;height:auto;margin:0 auto 1.25rem;filter:drop-shadow(0 12px 28px rgba(14,76,102,.4))}
    h1{font-size:clamp(2.6rem,10vw,4rem);margin:0;text-shadow:0 2px 20px rgba(14,76,102,.35)}
    p{font-size:1.15rem;margin:.5rem 0 1.75rem;color:rgba(255,255,255,.95)}
    a{display:inline-block;color:#0E4C66;background:#fff;font-weight:600;
      padding:.8rem 1.6rem;border-radius:999px;text-decoration:none;
      box-shadow:0 12px 24px -10px rgba(14,76,102,.5)}
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/logo.png" alt="Hawaiian Shirt Studios" />
    <h1>404</h1>
    <p>This page drifted off somewhere. Let&rsquo;s paddle back to shore.</p>
    <a href="/">Back home</a>
  </div>
</body>
</html>
